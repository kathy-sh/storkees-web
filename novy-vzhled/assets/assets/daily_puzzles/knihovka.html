<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Knihovka na zkoušku</title>

<style>
:root {

  --blue:#597E90; --blue-d:#456778; --gold:#D4A455; --edge:#633E2B; --on-blue:#FFF9EF;

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.4 var(--font); touch-action:manipulation; -webkit-user-select:none; user-select:none; }
#app { max-width:440px; margin:0 auto; padding-block:0 32px; padding-left:max(24px,env(safe-area-inset-left,0px)); padding-right:max(24px,env(safe-area-inset-right,0px)); }
#screen { position:relative; min-height:max(100dvh,680px); padding-top:24px; padding-bottom:100px; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:20px; }
h1 { margin:0; font-size:30px; line-height:1.15; flex:1; min-width:0; }
.round { position:relative; width:56px; height:56px; flex:none; padding:0; border:0; background:transparent; display:block; }
.round svg { width:100%; height:100%; display:block; }
button.round { cursor:pointer; border-radius:50%; }
button.round:active:not(:disabled) { transform:translateY(2px); }

.over { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:700 22px var(--font); color:var(--blue); }
#time { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; text-align:center; margin:32px 0 16px; }
#board { display:block; width:100%; height:auto; touch-action:none; overflow:visible; }

#tools { position:absolute; left:0; right:0; bottom:24px; display:flex; justify-content:space-between; }
#bubble { position:absolute; left:0; right:0; bottom:96px; z-index:7; background:var(--tile); border:1.5px solid var(--edge); border-radius:16px; padding:12px 16px; font-size:15px; }
#bubble p { margin:0; }

.label { font-size:14px; color:var(--soft); }
.seg { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; background:var(--given); padding:4px; border-radius:16px; }
.seg.two { grid-template-columns:repeat(2,1fr); }
.seg button { min-height:44px; border:0; border-radius:12px; background:transparent; color:var(--ink); font:700 15px var(--font); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--blue); color:var(--on-blue); }
.btn { min-height:56px; border:0; border-radius:16px; background:var(--blue); color:var(--on-blue); font:700 18px var(--font); box-shadow:0 4px 0 var(--blue-d); cursor:pointer; }
.btn.alt { background:var(--tile); color:var(--ink); box-shadow:0 4px 0 var(--line); }
.btn:active { transform:translateY(4px); box-shadow:none; }
button:focus-visible { outline:3px solid var(--blue-d); outline-offset:2px; }
#win { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--tile); border-radius:28px 28px 0 0; padding-top:24px; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); padding-left:max(24px,env(safe-area-inset-left,0px)); padding-right:max(24px,env(safe-area-inset-right,0px)); }

#win h2 { margin:0; font-size:30px; }
#win p { margin:0; font-size:18px; }
#winClose { position:absolute; top:8px; right:12px; width:48px; height:48px; padding:0; border:0; background:transparent; color:var(--ink); font:700 34px/1 var(--font); cursor:pointer; }

<script>

const LEVELS = {
  easy: { blocks: [7, 9], lo: 6, hi: 9, label: 'Lehká' },
  hard: { blocks: [10, 12], lo: 13, hi: 19, label: 'Těžká' },
  master: { blocks: [11, 13], lo: 24, hi: 99, label: 'Mistr' },
};
const SIZE = 6, EXIT_ROW = 2, GOAL = SIZE - 2, CAP = 80000;
const rnd = (k) => Math.floor(Math.random() * k);
// A block: { h: horizontal, len, line: row (h) or column (v) }; its position along the line lives in the state.
// A state is one number: block i's position is digit i in base 8.
const P8 = Array.from({ length: 16 }, (_, i) => 8 ** i);
const posOf = (s, i) => Math.floor(s / P8[i]) % 8;
const enc = (pos) => pos.reduce((s, p, i) => s + p * P8[i], 0);
const dec = (s, n) => Array.from({ length: n }, (_, i) => posOf(s, i));
const cellOf = (b, p) => (b.h ? b.line * SIZE + p : p * SIZE + b.line);
function occupancy(blocks, pos) {
  const g = new Int8Array(SIZE * SIZE).fill(-1);
  blocks.forEach((b, i) => { for (let k = 0; k < b.len; k++) g[cellOf(b, pos[i] + k)] = i; });
  return g;
}
// How far block i can go: [lowest, highest] position.
function range(blocks, pos, g, i) {
  const b = blocks[i];
  let lo = pos[i], hi = pos[i];
  while (lo > 0 && g[cellOf(b, lo - 1)] === -1) lo--;
  while (hi + b.len < SIZE && g[cellOf(b, hi + b.len)] === -1) hi++;
  return [lo, hi];
}
// Calls f(next state) for every single move from s.
function eachMove(blocks, s, f) {
  const pos = dec(s, blocks.length), g = occupancy(blocks, pos);
  for (let i = 0; i < blocks.length; i++) {
    const [lo, hi] = range(blocks, pos, g, i);
    for (let p = lo; p <= hi; p++) if (p !== pos[i]) f(s + (p - pos[i]) * P8[i]);
  }
}
// Every state reachable from start, with its distance to the nearest solved state (one move = one block slid any distance).
function distances(blocks, start) {
  const dist = new Map([[start, -1]]), list = [start];
  for (let k = 0; k < list.length; k++) {
    if (list.length > CAP) return null;
    eachMove(blocks, list[k], (q) => { if (!dist.has(q)) { dist.set(q, -1); list.push(q); } });
  }
  let front = list.filter((s) => s % 8 === GOAL);
  for (const s of front) dist.set(s, 0);
  for (let d = 1; front.length; d++) {
    const next = [];
    for (const s of front) eachMove(blocks, s, (q) => { if (dist.get(q) === -1) { dist.set(q, d); next.push(q); } });
    front = next;
  }
  return dist;
}
// Shortest way from pos to the exit: the positions after each move (empty when already out).
function solve(blocks, pos) {
  const start = enc(pos), prev = new Map([[start, -1]]), queue = [start];
  for (let k = 0; k < queue.length; k++) {
    const s = queue[k];
    if (s % 8 === GOAL) {
      const path = []; for (let t = s; t !== start; t = prev.get(t)) path.unshift(dec(t, blocks.length));
      return path;
    }
    eachMove(blocks, s, (q) => { if (!prev.has(q)) { prev.set(q, s); queue.push(q); } });
  }
  return null;
}
// Adds one random block where it fits; false when it did not fit.
function addBlock(blocks, pos) {
  const g = occupancy(blocks, pos);
  for (let tries = 0; tries < 60; tries++) {
    const h = !!rnd(2), len = rnd(4) ? 2 : 3, line = rnd(SIZE), p = rnd(SIZE - len + 1);
    if (h && line === EXIT_ROW) continue;
    const b = { h, len, line };
    let free = true; for (let k = 0; k < len; k++) if (g[cellOf(b, p + k)] !== -1) free = false;
    if (!free) continue;
    blocks.push(b); pos.push(p); return true;
  }
  return false;
}
// The hardest start among all states reachable from this board, within lo..hi moves.
function rate(blocks, pos, lo, hi) {
  const d = distances(blocks, enc(pos));
  if (!d) return null;
  let best = -1; const pick = [];
  for (const [s, v] of d) if (v <= hi) { if (v > best) { best = v; pick.length = 0; } if (v === best) pick.push(s); }
  return best < 0 ? null : { best, start: pick[rnd(pick.length)] };
}
// Random board, then small changes (one block added, removed or moved) kept whenever the puzzle gets no shorter.
function makePuzzle(level) {
  const { blocks: [a, b], lo, hi } = LEVELS[level];
  for (let t = 1; ; t++) {
    let blocks = [{ h: true, len: 2, line: EXIT_ROW, key: true }], pos = [rnd(3)];
    const count = a + rnd(b - a + 1);
    while (blocks.length <= count && addBlock(blocks, pos));
    let r = rate(blocks, pos, lo, hi);
    for (let step = 0; step < 40 && r && r.best < lo; step++) {
      const nb = blocks.slice(), np = dec(r.start, blocks.length), kind = rnd(3);
      if (kind !== 1 && nb.length > 4) { const i = 1 + rnd(nb.length - 1); nb.splice(i, 1); np.splice(i, 1); }
      if (kind !== 0 && nb.length < 15) addBlock(nb, np);
      const r2 = rate(nb, np, lo, hi);
      if (r2 && r2.best >= r.best) { blocks = nb; pos = np; r = r2; }
    }
    if (r && r.best >= lo) return { blocks, pos: dec(r.start, blocks.length), best: r.best, tries: t };
  }
}

let LOOK = location.search.includes('bedny') ? 'crates' : location.search.includes('vlacky') ? 'trains' : 'books';
// Picture of a piece: books come in three colours, taken in turn so that neighbours differ more often.
function pieceArt(b, i) {
  const set = ART[LOOK], name = (b.h ? 'h' : 'v') + b.len;
  if (b.key) return set.key;
  return Array.isArray(set[name]) ? set[name][i % set[name].length] : set[name];
}
function drawLooks() {

const tahy = (n) => n + (n === 1 ? ' tah' : n >= 2 && n <= 4 ? ' tahy' : ' tahů');

function parse(code) {
  const [body, best] = code.split(':'), blocks = [], pos = [];
