<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Denní hádanka na zkoušku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap">
<style>
/* Layout: one phone column, board in the middle, test switches kept apart at the bottom. Single light look, the Storkees menu palette. */
:root {
  --paper:#F5EEDF; --tile:#FFF9EF; --given:#E8DCC7; --line:#D9CDBB; --ink:#594332; --soft:#7A6555;
  --blue:#597E90; --blue-d:#456778; --gold:#D4A455; --bad:#B9472F; --on-blue:#FFF9EF;
  --font:"Mali","Comic Sans MS","Trebuchet MS",sans-serif;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.4 var(--font); touch-action:manipulation; -webkit-user-select:none; user-select:none; }
#app { max-width:440px; margin:0 auto; padding-block:0 32px; padding-left:max(24px,env(safe-area-inset-left,0px)); padding-right:max(24px,env(safe-area-inset-right,0px)); }
#screen { position:relative; min-height:max(100dvh,640px); padding-top:24px; padding-bottom:108px; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:20px; }
.round { position:relative; width:56px; height:56px; flex:none; padding:0; border:0; background:transparent; display:block; }
.round svg { width:100%; height:100%; display:block; }
#hintBtn { width:60px; height:60px; }
#hintBtn, #rulesBtn { cursor:pointer; border-radius:50%; }
#rulesBtn { width:40px; height:40px; }
#hintBtn:active:not(:disabled), #rulesBtn:active { transform:translateY(2px); }
.over { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:700 22px var(--font); color:var(--blue); }
h1 { margin:0; font-size:30px; line-height:1.15; flex:1; min-width:0; }
.level { color:var(--soft); font-size:14px; }
#timeRow { display:flex; align-items:center; margin:40px 0 16px; min-height:48px; }
.slot { flex:none; display:block; }
#time { flex:1; font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; text-align:center; }
#screen #rulesBtn, #screen #hintBtn { width:56px; height:56px; }
#screen[data-btn="c"] #rulesBtn, #screen[data-btn="c"] #hintBtn { width:48px; height:48px; }
#screen[data-btn="a"] #tools { position:static; margin-top:24px; gap:32px; }
#screen[data-btn="b"] #tools { justify-content:space-between; }
#screen[data-btn="c"] #tools { display:none; }
#screen[data-btn="a"] #bubble, #screen[data-btn="c"] #bubble { bottom:24px; }
#wrap { position:relative; }
#board { display:grid; gap:4px; background:var(--line); padding:6px; border-radius:16px; }
.cell { aspect-ratio:1; min-width:0; padding:12%; border:0; border-radius:8px; background:var(--tile); color:inherit; font:inherit; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.cell svg, .opt svg, .cell img, .opt img { width:100%; height:100%; display:block; pointer-events:none; }
.big .cell { padding:6%; }
.cell.given { background:var(--given); cursor:default; }
.cell.sel { box-shadow:inset 0 0 0 3px var(--blue); }
.cell.bad { background:#F3C9BD; box-shadow:inset 0 0 0 3px var(--bad); }
.cell.hint { box-shadow:0 0 0 3px var(--gold), inset 0 0 0 3px var(--gold); position:relative; z-index:3; }
.cell img, .cell svg { position:relative; z-index:3; }
#signs { position:absolute; inset:0; pointer-events:none; z-index:2; }
.sign { position:absolute; transform:translate(-50%,-50%); background:var(--tile); padding:4px; display:flex; }
.sign svg { display:block; }
button:focus-visible { outline:3px solid var(--blue-d); outline-offset:2px; }
#pop { position:absolute; z-index:5; display:flex; gap:4px; padding:4px; background:var(--tile); border:3px solid var(--ink); border-radius:16px; }
.opt.on { box-shadow:inset 0 0 0 3px var(--blue); }
.opt { width:48px; height:48px; padding:8px; border:0; border-radius:8px; background:var(--given); color:var(--ink); font:700 20px var(--font); cursor:pointer; }
#picker { display:flex; gap:8px; justify-content:center; }
#picker .opt { width:72px; height:64px; padding:12px 20px; }
#picker .opt:disabled { opacity:.4; }
#tools { position:absolute; left:0; right:0; bottom:24px; display:flex; justify-content:center; gap:24px; }
.btn { min-height:56px; border:0; border-radius:16px; background:var(--blue); color:var(--on-blue); font:700 18px var(--font); box-shadow:0 4px 0 var(--blue-d); cursor:pointer; }
.btn:active:not(:disabled) { transform:translateY(4px); box-shadow:none; }
.btn:disabled { background:var(--given); color:var(--soft); box-shadow:0 4px 0 var(--line); cursor:default; }
.btn.alt { background:var(--tile); color:var(--ink); box-shadow:0 4px 0 var(--line); }
#bubble { position:absolute; left:0; right:0; bottom:100px; z-index:6; background:var(--tile); border:1.5px solid #633E2B; border-radius:16px; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
#bubble p { margin:0; }
#bubble .step { font-weight:700; }
#bubble .rule { font-size:15px; }
#test { border-top:2px dashed var(--line); padding-top:16px; display:flex; flex-direction:column; gap:8px; }
.label { font-size:14px; color:var(--soft); }
.seg { display:grid; gap:4px; background:var(--given); padding:4px; border-radius:16px; }
.seg.three { grid-template-columns:repeat(3,1fr); }
.seg.two { grid-template-columns:repeat(2,1fr); }
.seg button { min-height:44px; border:0; border-radius:12px; background:transparent; color:var(--ink); font:700 15px var(--font); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--blue); color:var(--on-blue); }
#modeInfo { margin:0; font-size:15px; }
#win { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--tile); border-top:3px solid var(--ink); border-radius:24px 24px 0 0; padding-top:24px; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
#win > div { max-width:408px; margin:0 auto; display:flex; flex-direction:column; gap:12px; text-align:center; }
#win h2 { margin:0; font-size:28px; }
#win p { margin:0; font-size:18px; }
#winClose { position:absolute; top:8px; right:12px; width:48px; height:48px; padding:0; border:0; background:transparent; color:var(--ink); font:700 34px/1 var(--font); cursor:pointer; }

    <div class="label">Jen pro zkoušku: obtížnost</div>
    <div class="seg three" id="levels"></div>
    <button class="btn alt" id="fresh" type="button">Nová hádanka</button>
  </section>
</div>

  <button class="btn" id="winMain" type="button"></button>

</div></div>

<script>
/*LOGIC-START*/
const LEVELS = {
  easy: { n: 6, minClues: 14, deep: false, label: 'Lehčí, 6 × 6' },
  hard: { n: 8, minClues: 20, deep: false, label: 'Těžší, 8 × 8' },
  master: { n: 8, minClues: 6, deep: true, rels: 14, label: 'Mistr, 8 × 8' },
};
const lineCache = {};
function linesFor(n) {

function drawSigns() {
  const cells = $('board').children, box = $('signs');
  box.innerHTML = '';
  for (const [a, b, same] of S.p.rels) {
    const ca = cells[a], cb = cells[b], d = document.createElement('div');
    d.className = 'sign';
    d.innerHTML = same ? MARK_SAME : MARK_DIFF;
    d.style.left = (ca.offsetLeft + ca.offsetWidth / 2 + cb.offsetLeft + cb.offsetWidth / 2) / 2 + 'px';
    d.style.top = (ca.offsetTop + ca.offsetHeight / 2 + cb.offsetTop + cb.offsetHeight / 2) / 2 + 'px';
    box.appendChild(d);
  }
}

function paint() {
  const broken = brokenCells(S.g, S.p.n, S.p.rels);
  const bad = new Set([...S.shownBad].filter((x) => broken.has(x)));
  [...$('board').children].forEach((c, i) => {
    const v = S.g[i], given = S.p.start[i] !== -1;
    c.className = 'cell' + (given ? ' given' : '') + (S.sel === i ? ' sel' : '') + (bad.has(i) ? ' bad' : '') + (S.hint === i ? ' hint' : '');
    c.innerHTML = v === -1 ? '' : SYM[v];
    c.setAttribute('aria-label', 'Řádek ' + (Math.floor(i / S.p.n) + 1) + ', sloupec ' + (i % S.p.n + 1) + ': ' + (v === -1 ? 'prázdné' : NAMES[v].one));
  });
  drawPicker();
  drawHintBtn();
}

function drawHintBtn() {
  const b = $('hintBtn');
  const wait = S.pauseLeft > 0;
  b.disabled = wait || S.done;
  $('hintMark').hidden = wait;

  if (wait) $('hintWait').textContent = Math.ceil(S.pauseLeft);
}

function drawPicker() {
  const p = $('picker');
  p.hidden = S.mode !== 'bottom';
  if (p.hidden) return;
  const can = S.sel !== -1;
  p.innerHTML = '';
  [[0, SYM[0], NAMES[0].one], [1, SYM[1], NAMES[1].one], [-1, '×', 'Vymazat']].forEach(([v, html, name]) => {
    const o = document.createElement('button');
    o.type = 'button'; o.className = 'opt'; o.innerHTML = html; o.disabled = !can; o.setAttribute('aria-label', name);
    o.addEventListener('click', (e) => { e.stopPropagation(); if (S.sel !== -1) put(S.sel, v); });
    p.appendChild(o);
  });
}

function drawSwitches() {
  const m = $('modes'); m.innerHTML = '';
  Object.keys(MODES).forEach((k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = MODES[k].label; b.setAttribute('aria-pressed', S.mode === k);
    b.addEventListener('click', () => { S.mode = k; S.sel = -1; $('pop').hidden = true; drawSwitches(); paint(); });
    m.appendChild(b);
  });
  $('modeInfo').textContent = MODES[S.mode].info;
  const st = $('sets'); st.innerHTML = '';
  SETS.forEach((x, k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = x.label; b.setAttribute('aria-pressed', S.set === k);
    b.addEventListener('click', () => { S.set = k; applySet(k); $('pop').hidden = true; S.hint = -1; $('bubble').hidden = true; drawSwitches(); paint(); });

}

function tap(i) {

  if (S.mode === 'popup' && !$('pop').hidden && S.sel === i) { closePop(); paint(); return; }
  if (S.mode === 'cycle') { const v = S.g[i]; put(i, v === -1 ? 0 : v === 0 ? 1 : -1); return; }
  S.sel = i;

}

function showPop(i) {
  const pop = $('pop'); pop.innerHTML = '';

    const o = document.createElement('button');

function closePop() { $('pop').hidden = true; S.sel = S.mode === 'popup' ? -1 : S.sel; }

function put(i, v) {

  S.undo.push([i, S.g[i]]);

  armErrors();
  paint();
  if (S.g.every((x, k) => x === S.p.solution[k])) win();
}

function win() {

  const next = { easy: ['Troufneš si na těžší?', 'hard'], hard: ['Troufneš si na Mistra?', 'master'], master: ['Další mistrovská hádanka', 'master'] }[S.level];
  $('winMain').textContent = next[0];
  $('winOther').textContent = easy ? 'Další lehká hádanka' : 'Lehčí hádanka';
  $('winMain').onclick = () => newGame(next[1]);
  $('winOther').onclick = () => newGame('easy');

function hint() {
  if (S.pauseLeft > 0 || S.done || S.hint !== -1) return;
  closePop();
  $('bubble').hidden = true;
  let target = S.g.findIndex((v, i) => v !== -1 && v !== S.p.solution[i]);
  if (target === -1) {
    const s = nextStep(S.g, S.p.n, true, S.p.rels);
    target = s ? s.i : S.g.indexOf(-1);
    if (target === -1) return;
  }
  S.hint = target;
  S.pauseLeft = HINT_PAUSE;
  clearTimeout(S.hintTimer);
  S.hintTimer = setTimeout(() => { S.hint = -1; paint(); }, 1500);
  put(target, S.p.solution[target]);

function tick() {
  const now = performance.now();
  if (!S.done && !document.hidden) {

    S.elapsed += d;

    $('time').textContent = fmt(S.elapsed);
  }
  S.last = now;
}
