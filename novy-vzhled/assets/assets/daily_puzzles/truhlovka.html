<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Truhlovka na zkoušku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap">
<style>
:root {
  --paper:#F5EEDF; --tile:#FFF9EF; --given:#E8DCC7; --line:#D9CDBB; --ink:#594332; --soft:#7A6555;
  --blue:#597E90; --blue-d:#456778; --gold:#D4A455; --edge:#633E2B; --on-blue:#FFF9EF;
  --font:"Mali","Comic Sans MS","Trebuchet MS",sans-serif;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--paper); color:var(--ink); font:400 16px/1.4 var(--font); touch-action:manipulation; -webkit-user-select:none; user-select:none; }
#app { max-width:440px; margin:0 auto; padding-block:0 32px; padding-left:max(24px,env(safe-area-inset-left,0px)); padding-right:max(24px,env(safe-area-inset-right,0px)); }
#screen { position:relative; min-height:max(100dvh,680px); padding-top:24px; padding-bottom:100px; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:20px; }
h1 { margin:0; font-size:30px; line-height:1.15; flex:1; min-width:0; }
.round { position:relative; width:56px; height:56px; flex:none; padding:0; border:0; background:transparent; display:block; }
.round svg { width:100%; height:100%; display:block; }
button.round { cursor:pointer; border-radius:50%; }
button.round:active:not(:disabled) { transform:translateY(2px); }
button.round:disabled { opacity:.45; }
.over { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:700 22px var(--font); color:var(--blue); }
#time { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; text-align:center; margin:32px 0 16px; }
#board { display:block; width:100%; height:auto; touch-action:none; }
#board text { font-family:var(--font); font-weight:700; }
#tools { position:absolute; left:0; right:0; bottom:24px; display:flex; justify-content:space-between; }
#bubble { position:absolute; left:0; right:0; bottom:96px; z-index:7; background:var(--tile); border:1.5px solid var(--edge); border-radius:16px; padding:12px 16px; font-size:15px; }
#bubble p { margin:0; }
#test { border-top:2px dashed var(--line); padding-top:16px; display:flex; flex-direction:column; gap:8px; }
.label { font-size:14px; color:var(--soft); }
.seg { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; background:var(--given); padding:4px; border-radius:16px; }
.seg button { min-height:44px; border:0; border-radius:12px; background:transparent; color:var(--ink); font:700 15px var(--font); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--blue); color:var(--on-blue); }
.btn { min-height:56px; border:0; border-radius:16px; background:var(--blue); color:var(--on-blue); font:700 18px var(--font); box-shadow:0 4px 0 var(--blue-d); cursor:pointer; }
.btn.alt { background:var(--tile); color:var(--ink); box-shadow:0 4px 0 var(--line); }
.btn:active { transform:translateY(4px); box-shadow:none; }
button:focus-visible { outline:3px solid var(--blue-d); outline-offset:2px; }
#win { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--tile); border-radius:28px 28px 0 0; padding-top:24px; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px)); padding-left:max(24px,env(safe-area-inset-left,0px)); padding-right:max(24px,env(safe-area-inset-right,0px)); }
#win > div { max-width:392px; margin:0 auto; display:flex; flex-direction:column; gap:12px; text-align:center; }
#win h2 { margin:0; font-size:30px; }
#win p { margin:0; font-size:18px; }
#winClose { position:absolute; top:8px; right:12px; width:48px; height:48px; padding:0; border:0; background:transparent; color:var(--ink); font:700 34px/1 var(--font); cursor:pointer; }
</style>

<div id="app">
  <div id="screen">
    <header>
      <div class="round" id="backFace" aria-hidden="true"></div>
      <h1>Truhlovka</h1>

    <svg id="board" role="img" aria-label="Hrací mřížka"></svg>

      <button class="round" id="rulesBtn" type="button" aria-label="Pravidla"></button>
      <button class="round" id="undoBtn" type="button" aria-label="Vrátit tah"></button>

    </div>
  </div>
  <section id="test">
    <div class="label">Jen pro zkoušku: obtížnost</div>
    <div class="seg" id="levels"></div>
    <button class="btn alt" id="fresh" type="button">Nová hádanka</button>
  </section>
</div>

  <button id="winClose" type="button" aria-label="Zavřít">×</button>
  <h2>Hotovo!</h2>
  <p>Všechny truhly svítí.</p>
  <p id="winTime"></p>
  <button class="btn" id="winMain" type="button"></button>
  <button class="btn alt" id="winOther" type="button"></button>
</div></div>

<script>
/*LOGIC-START*/
// A grid with chests. Every chest gets exactly one candle right next to it (not diagonally),
// candles never touch, not even at a corner, and the numbers say how many candles each row and column has.
const LEVELS = {
  easy: { n: 6, chests: 7, kind: 'simple', label: 'Lehká, 6 × 6' },
  hard: { n: 8, chests: 12, kind: 'simple', label: 'Těžká, 8 × 8' },
  master: { n: 8, chests: 13, kind: 'deep', label: 'Mistr, 8 × 8' },
};
const UNKNOWN = 0, CANDLE = 1, EMPTY = 2, CHEST = 3;
const ORTHO = [[-1, 0], [1, 0], [0, -1], [0, 1]];
function around(n, i, diag) {
  const r = Math.floor(i / n), c = i % n, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    if (!diag && dr && dc) continue;
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < n && cc >= 0 && cc < n) out.push(rr * n + cc);
  }
  return out;
}
const lineCells = (n, l) => Array.from({ length: n }, (_, k) => (l < n ? l * n + k : k * n + (l - n)));
// Can every chest get its own neighbouring candle? (matching chests to candles)
function matched(p, g) {
  const n = p.n, chests = [], owner = new Map();
  for (let i = 0; i < n * n; i++) if (p.chest[i]) chests.push(i);
  const candles = g.filter((v) => v === CANDLE).length;
  if (candles !== chests.length) return false;
  const tryChest = (ch, seen) => {
    for (const j of around(n, ch, false)) {
      if (g[j] !== CANDLE || seen.has(j)) continue;
      seen.add(j);
      if (!owner.has(j) || tryChest(owner.get(j), seen)) { owner.set(j, ch); return true; }
    }
    return false;
  };
  return chests.every((ch) => tryChest(ch, new Set()));
}
// One round of sure steps. Returns a list of [cell, value], or null when the state is impossible.
function sureSteps(p, g) {
  const n = p.n, out = new Map();
  const put = (i, v) => { if (g[i] === UNKNOWN && !out.has(i)) out.set(i, v); };
  for (let i = 0; i < n * n; i++) {
    if (g[i] === CANDLE) for (const j of around(n, i, true)) { if (g[j] === CANDLE) return null; put(j, EMPTY); }
  }
  for (let i = 0; i < n * n; i++) if (g[i] === UNKNOWN && !around(n, i, false).some((j) => p.chest[j])) put(i, EMPTY);
  for (let l = 0; l < 2 * n; l++) {
    const cells = lineCells(n, l), need = p.counts[l];
    const k = cells.filter((i) => g[i] === CANDLE).length, free = cells.filter((i) => g[i] === UNKNOWN);
    if (k > need || k + free.length < need) return null;
    if (free.length && k === need) free.forEach((i) => put(i, EMPTY));
    else if (free.length && k + free.length === need) free.forEach((i) => put(i, CANDLE));
  }
  for (let i = 0; i < n * n; i++) {
    if (!p.chest[i]) continue;
    const nb = around(n, i, false);
    if (nb.some((j) => g[j] === CANDLE)) continue;
    const free = nb.filter((j) => g[j] === UNKNOWN);
    if (!free.length) return null;
    if (free.length === 1) put(free[0], CANDLE);
  }
  // A step that puts a candle next to another new candle is impossible too.
  for (const [i, v] of out) if (v === CANDLE && around(n, i, true).some((j) => out.get(j) === CANDLE)) return null;
  return [...out];
}
function propagate(p, g) {
  for (;;) {
    const s = sureSteps(p, g);
    if (!s) return false;
    if (!s.length) return !g.includes(UNKNOWN) ? matched(p, g) : true;
    for (const [i, v] of s) g[i] = v;
  }
}
function startGrid(p) { return p.chest.map((c) => (c ? CHEST : UNKNOWN)); }
// Solves with sure steps only; deep also allows "if this cell were so, it would break".
function deduce(p, deep) {
  const g = startGrid(p);
  if (!propagate(p, g)) return false;
  while (g.includes(UNKNOWN)) {
    if (!deep) return false;
    let moved = false;
    for (let i = 0; i < g.length && !moved; i++) {
      if (g[i] !== UNKNOWN) continue;
      for (const guess of [CANDLE, EMPTY]) {
        const t = g.slice(); t[i] = guess;
        if (!propagate(p, t)) { g[i] = guess === CANDLE ? EMPTY : CANDLE; moved = true; break; }
      }
    }
    if (!moved || !propagate(p, g)) return false;
  }
  return g.every((v, i) => (v === CANDLE) === (p.sol[i] === CANDLE));
}
// Counts different candle layouts (up to `limit`) by giving every chest a direction.
function countSolutions(p, limit) {
  const n = p.n, chests = [];
  for (let i = 0; i < n * n; i++) if (p.chest[i]) chests.push(i);
  const g = new Array(n * n).fill(0), cnt = new Array(2 * n).fill(0), found = new Set();
  let nodes = 0;
  const rowsOk = (upTo) => { for (let r = 0; r <= upTo && r < n; r++) if (cnt[r] !== p.counts[r]) return false; return true; };
  const go = (k) => {
    if (found.size >= limit || ++nodes > 2e6) return;
    const next = k < chests.length ? Math.floor(chests[k] / n) : n + 1;
    if (!rowsOk(next - 2)) return;
    if (k === chests.length) {
      for (let l = 0; l < 2 * n; l++) if (cnt[l] !== p.counts[l]) return;
      found.add(g.join('')); return;
    }
    for (const j of around(n, chests[k], false)) {
      if (p.chest[j] || g[j]) continue;
      if (around(n, j, true).some((x) => g[x])) continue;
      const r = Math.floor(j / n), c = n + (j % n);
      if (cnt[r] >= p.counts[r] || cnt[c] >= p.counts[c]) continue;
      g[j] = 1; cnt[r]++; cnt[c]++;
      go(k + 1);
      g[j] = 0; cnt[r]--; cnt[c]--;
    }
  };
  go(0);
  return nodes > 2e6 ? -1 : found.size;
}
function randomLayout(n, want) {
  const chest = new Array(n * n).fill(false), sol = new Array(n * n).fill(EMPTY);
  let placed = 0;
  for (let t = 0; t < 400 && placed < want; t++) {
    const i = Math.floor(Math.random() * n * n);
    if (chest[i] || sol[i] === CANDLE || around(n, i, true).some((j) => sol[j] === CANDLE)) continue;
    const spots = around(n, i, false).filter((j) => !chest[j] && sol[j] !== CANDLE);
    if (!spots.length) continue;
    chest[spots[Math.floor(Math.random() * spots.length)]] = true;
    sol[i] = CANDLE; placed++;
  }
  if (placed < want) return null;
  for (let i = 0; i < n * n; i++) if (chest[i]) sol[i] = CHEST;
  const counts = [];
  for (let l = 0; l < 2 * n; l++) counts.push(lineCells(n, l).filter((i) => sol[i] === CANDLE).length);
  return { n, chest, sol, counts };
}
function makePuzzle(level) {
  const L = LEVELS[level];
  let last = null;
  for (let t = 0; t < 3000; t++) {
    const p = randomLayout(L.n, L.chests);
    if (!p || countSolutions(p, 2) !== 1) continue;
    const simple = deduce(p, false);
    if (L.kind === 'simple' && simple) return p;
    if (L.kind === 'deep' && deduce(p, true)) { last = p; if (!simple) return p; }
  }
  return last;
}
/*LOGIC-END*/

  b.innerHTML = '<p>Ke každé truhle postav jednu svíčku hned vedle ní: nahoru, dolů, doleva nebo doprava. Svíčky se nesmí dotýkat, ani rohem. Čísla říkají, kolik svíček je v řádku nebo sloupci. Ťukni jednou pro svíčku, podruhé pro tečku, že tu nic není.</p>';
  b.hidden = false;
});
$('fresh').addEventListener('click', () => newGame(S.level));
$('winClose').addEventListener('click', (e) => { e.stopPropagation(); $('win').hidden = true; });
document.addEventListener('click', () => { $('bubble').hidden = true; });
document.addEventListener('visibilitychange', () => { S.last = performance.now(); });
setInterval(tick, 250);
newGame(location.search.includes('mistr') ? 'master' : location.search.includes('tezsi') ? 'hard' : 'easy');
</script>
