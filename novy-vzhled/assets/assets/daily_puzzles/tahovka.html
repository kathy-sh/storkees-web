* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

header { display:flex; align-items:center; gap:20px; }
h1 { margin:0; font-size:30px; line-height:1.15; flex:1; min-width:0; }

#bubble p { margin:0; }

.label { font-size:14px; color:var(--soft); }
.seg { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; background:var(--given); padding:4px; border-radius:16px; }
.seg button { min-height:44px; border:0; border-radius:12px; background:transparent; color:var(--ink); font:700 15px var(--font); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--blue); color:var(--on-blue); }

.btn.alt { background:var(--tile); color:var(--ink); box-shadow:0 4px 0 var(--line); }
.btn:active { transform:translateY(4px); box-shadow:none; }
button:focus-visible { outline:3px solid var(--blue-d); outline-offset:2px; }

<script>
/*LOGIC-START*/
const LEVELS = {
  easy: { n: 5, marks: 7, maxMarks: 13, trim: false, deep: false, walls: 0, label: 'Lehká, 5 × 5' },
  hard: { n: 6, marks: 6, maxMarks: 16, trim: true, deep: false, walls: 0, label: 'Těžká, 6 × 6' },
  master: { n: 7, marks: 5, maxMarks: 14, trim: true, deep: true, walls: 14, label: 'Mistr, 7 × 7' },
};
const rnd = (k) => Math.floor(Math.random() * k);
const key = (a, b) => (a < b ? a + ':' + b : b + ':' + a);
function neighbours(i, n) {
  const r = Math.floor(i / n), c = i % n, out = [];
  if (r > 0) out.push(i - n);
  if (r < n - 1) out.push(i + n);
  if (c > 0) out.push(i - 1);
  if (c < n - 1) out.push(i + 1);
  return out;
}
// A random path through every cell: start from a snake and keep bending its end.
function randomPath(n) {
  let p = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) p.push(r * n + (r % 2 ? n - 1 - c : c));
  for (let t = 30 * n * n; t > 0; t--) {
    if (rnd(2)) p.reverse();
    const head = p[p.length - 1], nb = neighbours(head, n), w = nb[rnd(nb.length)];
    if (w === p[p.length - 2]) continue;
    const at = p.indexOf(w);
    p = p.slice(0, at + 1).concat(p.slice(at + 1).reverse());
  }
  return p;
}
function adjacency(n, walls) {
  return Array.from({ length: n * n }, (_, i) => neighbours(i, n).filter((w) => !walls.has(key(i, w))));
}
// Solver working on links between cells: each link is unknown (0), used (1) or impossible (-1).
function buildEdges(adj) {
  const list = [], at = adj.map(() => []);
  adj.forEach((nb, a) => nb.forEach((b) => { if (a < b) { at[a].push(list.length); at[b].push(list.length); list.push([a, b]); } }));
  return { list, at };
}
// Cells of each finished stretch in walking order, or null when the used links are impossible.
function stretches(p, st) {
  const N = p.N, seen = new Array(N).fill(false), out = new Array(N).fill(null), nbs = Array.from({ length: N }, () => []);
  p.E.list.forEach(([a, b], e) => { if (st[e] === 1) { nbs[a].push(b); nbs[b].push(a); } });
  if (nbs.some((x) => x.length > 2)) return null; // a cell can never have three links
  for (let v = 0; v < N; v++) {
    if (seen[v] || nbs[v].length === 2) continue;
    const seg = [v]; seen[v] = true;
    for (let prev = -1, cur = v;;) {
      const nx = nbs[cur].find((x) => x !== prev);
      if (nx === undefined) break;
      seen[nx] = true; seg.push(nx); prev = cur; cur = nx;
    }
    if (!numbersOk(p, seg)) return null;
    for (const x of seg) out[x] = seg;
  }
  return seen.every(Boolean) ? out : null; // a cell left over means a closed loop
}
function numbersOk(p, seg) {
  const list = seg.map((x) => p.num[x]).filter(Boolean);
  if (list.length < 2) return !(seg.length < p.N && list.length === 2);
  const dir = list[1] - list[0];
  if (Math.abs(dir) !== 1) return false;

  e.stopPropagation();
  if (eraseHeld) { eraseHeld = false; return; }
  if (S.path.length > 1 && !S.done) { S.path.pop(); paint(); }
});
$('hintBtn').addEventListener('click', (e) => { e.stopPropagation(); hint(); });
$('rulesBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const b = $('bubble');
  if (!b.hidden) { b.hidden = true; return; }
  b.innerHTML = '<p>Spoj čísla popořadě jednou nepřerušenou cestou a projdi přitom všechna políčka. Přes tmavé zdi cesta nevede.</p>';
  b.hidden = false;
});
$('fresh').addEventListener('click', () => newGame(S.level));
document.addEventListener('click', () => { $('bubble').hidden = true; });
document.addEventListener('visibilitychange', () => { S.last = performance.now(); });
setInterval(tick, 250);
newGame(location.search.includes('mistr') ? 'master' : location.search.includes('tezsi') ? 'hard' : 'easy');
$('winClose').addEventListener('click', (e) => { e.stopPropagation(); $('win').hidden = true; });
</script>
